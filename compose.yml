x-market-env: &market-env
  SPRING_PROFILES_ACTIVE: prod
  MYSQL_HOST: mysql
  MYSQL_USER: campus
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}
  NACOS_ADDR: nacos:8848
  NACOS_USERNAME: nacos
  NACOS_PASSWORD: ${NACOS_PASSWORD:?set NACOS_PASSWORD}
  SEATA_SERVER: seata:8091
  MONITOR_ENABLED: "true"
  MONITOR_URL: http://monitor:8090
  MONITOR_USER: monitor
  MONITOR_PASSWORD: ${MONITOR_PASSWORD:?set MONITOR_PASSWORD}
  TZ: UTC
x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  nacos-init:
    condition: service_completed_successfully
  seata:
    condition: service_started
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: campus_product
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-full-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-market.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -ucampus -e 'SELECT 1' campus_product"]
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: campus
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: campus
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY_VALUE:?set NACOS_IDENTITY_VALUE}
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40
  nacos-init:
    image: curlimages/curl:8.10.1
    environment:
      NACOS_PASSWORD: ${NACOS_PASSWORD}
    volumes:
      - ./deploy/nacos-init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      nacos:
        condition: service_healthy
  seata:
    image: seataio/seata-server:2.0.0
    environment:
      SEATA_IP: seata
      SEATA_USER: seata
      SEATA_PASSWORD: ${SEATA_PASSWORD:?set SEATA_PASSWORD}
      SEATA_SECRET: ${SEATA_SECRET:?set SEATA_SECRET}
    volumes:
      - ./deploy/seata/application.yml:/seata-server/resources/application.yml:ro
      - seata-data:/seata-server/sessionStore
  user:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: user-service
    environment:
      <<: *market-env
      MARKET_ADMIN_PASSWORD: ${MARKET_ADMIN_PASSWORD:?set MARKET_ADMIN_PASSWORD}
      MARKET_WX_APPID: ${WX_APPID:-}
      MARKET_WX_SECRET: ${WX_SECRET:-}
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL: http://user:8081
    depends_on: *app-depends
    restart: on-failure
  product:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: product-service
    environment:
      <<: *market-env
      SPRING_PROFILES_ACTIVE: prod,seata
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_URL: http://user:8081/api/users/identity
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL: http://product:8082
    depends_on:
      <<: *app-depends
      redis:
        condition: service_started
    restart: on-failure
  order:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: order-service
    environment:
      <<: *market-env
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: campus
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL: http://order:8083
    depends_on:
      <<: *app-depends
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: gateway
    ports:
      - "8080:8080"
    environment:
      <<: *market-env
      USER_ROUTE: http://user:8081
      PRODUCT_ROUTE: http://product:8082
      ORDER_ROUTE: http://order:8083
      AUTH_URL: http://user:8081/api/users/identity
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL: http://gateway:8080
    depends_on:
      user:
        condition: service_started
      product:
        condition: service_started
      order:
        condition: service_started
    restart: on-failure
  monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: admin-server
    environment:
      MONITOR_USER: monitor
      MONITOR_PASSWORD: ${MONITOR_PASSWORD}
    ports:
      - "127.0.0.1:8090:8090"
volumes:
  mysql-full-data:
  redis-data:
  rabbit-data:
  nacos-data:
  seata-data:
