spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      validation-query: SELECT 1
    url: jdbc:h2:mem:market;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/demo.sql
management:
  health:
    redis:
      enabled: false
