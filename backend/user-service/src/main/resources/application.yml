server:
  port: 8081
spring:
  boot:
    admin:
      client:
        enabled: ${MONITOR_ENABLED:false}
        url: ${MONITOR_URL:http://monitor:8090}
        username: ${MONITOR_USER:monitor}
        password: ${MONITOR_PASSWORD:}
  application:
    name: user-service
  profiles:
    default: demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      validation-query: SELECT 1
  cloud:
    nacos:
      discovery:
        enabled: false
    sentinel:
      eager: true
seata:
  enabled: false
  enable-auto-data-source-proxy: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
market:
  internal-token: ${INTERNAL_TOKEN:}
  demo: true
